name: native-windows

on:
  workflow_dispatch:
    inputs:
      license:
        description: "License flavour to build"
        type: choice
        options: [both, lgpl, gpl]
        default: both
      rids:
        description: "Space-separated RIDs (blank = all windows)"
        type: string
        default: ""
  workflow_call:
    inputs:
      license:
        type: string
        default: both
      rids:
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: native-windows-${{ github.ref }}-${{ inputs.license }}-${{ inputs.rids }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        shell: bash
        run: |
          ALL="win-x64 win-x86 win-arm64"
          RIDS="${{ inputs.rids }}"; [ -z "$RIDS" ] && RIDS="$ALL"
          LIC="${{ inputs.license }}"; [ -z "$LIC" ] && LIC="both"
          case "$LIC" in both) LICS="lgpl gpl";; *) LICS="$LIC";; esac
          inc=""; first=1
          for r in $RIDS; do for l in $LICS; do
            [ $first -eq 1 ] || inc="$inc,"; first=0
            inc="$inc{\"rid\":\"$r\",\"license\":\"$l\"}"
          done; done
          echo "matrix={\"include\":[$inc]}" >> "$GITHUB_OUTPUT"
          echo "include: [$inc]"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: ${{ matrix.rid }} / ${{ matrix.license }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            nasm yasm pkg-config git cmake ninja-build python3-pip curl xz-utils
          python3 -m pip install --quiet --upgrade meson

      - name: Fetch llvm-mingw toolchain
        run: |
          url=$(curl -fsSL https://api.github.com/repos/mstorsjo/llvm-mingw/releases/latest \
            | grep browser_download_url | grep 'ucrt-ubuntu' | grep 'x86_64.tar.xz' \
            | head -1 | cut -d'"' -f4)
          echo "Downloading llvm-mingw: $url"
          curl -fL "$url" -o /tmp/llvm-mingw.tar.xz
          mkdir -p "$HOME/llvm-mingw"
          tar -xf /tmp/llvm-mingw.tar.xz -C "$HOME/llvm-mingw" --strip-components=1
          echo "LLVM_MINGW_ROOT=$HOME/llvm-mingw" >> "$GITHUB_ENV"

      - name: Build FFmpeg
        run: |
          chmod +x build/ffmpeg/build.sh
          build/ffmpeg/build.sh --rid "${{ matrix.rid }}" --license "${{ matrix.license }}"

      - name: Package artifact
        run: |
          tar -C artifacts/native -czf "ffmpeg-${{ matrix.license }}-${{ matrix.rid }}.tar.gz" \
            "${{ matrix.license }}/${{ matrix.rid }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.license }}-${{ matrix.rid }}
          path: ffmpeg-${{ matrix.license }}-${{ matrix.rid }}.tar.gz
          retention-days: 14
          if-no-files-found: error
