name: test-mobile

# Runs the shared Tests.Core suite inside the MAUI host app on a real Android
# emulator and iOS simulator. Native binaries are taken from the published
# release packages (no native rebuild). The app prints machine-readable markers
# (##MOBILE_DONE## PASS|FAIL) and self-exits so the harness can assert the result.

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        default: "9.0.1-preview.1"
      platforms:
        type: choice
        options: [both, android, ios]
        default: both

permissions:
  contents: read

jobs:
  android:
    if: ${{ inputs.platforms == 'both' || inputs.platforms == 'android' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Fetch Android native libraries from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "v${{ inputs.version }}" --repo "$GITHUB_REPOSITORY" \
            -D dl -p 'FFmpegSharpApi.Native.Android.*.nupkg'
          mkdir -p native/android
          unzip -o dl/FFmpegSharpApi.Native.Android.*.nupkg -d native/android >/dev/null
          echo "Android native tree:"; find native/android/runtimes -name '*.so' | sort

      - name: Build Android test APK
        run: |
          set -euo pipefail
          dotnet build Tests/FFmpegSharpApi.Tests.Maui/FFmpegSharpApi.Tests.Maui.csproj \
            -c Debug -f net10.0-android \
            -p:FFmpegNativeDir="$PWD/native/android/runtimes" \
            -p:EmbedAssembliesIntoApk=true \
            -p:AndroidEnableProfiledAot=false \
            -p:RunAOTCompilation=false
          find Tests/FFmpegSharpApi.Tests.Maui/bin -name '*-Signed.apk' -print

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/build/android-emulator-test.sh"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-logcat
          path: logcat.txt
          if-no-files-found: ignore

  ios:
    if: ${{ inputs.platforms == 'both' || inputs.platforms == 'ios' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain diagnostics (use the runner's self-consistent defaults)
        run: |
          which dotnet; dotnet --version
          echo "--- installed workloads ---"; dotnet workload list || true
          echo "--- default Xcode ---"; xcodebuild -version
          echo "--- simulator runtimes ---"; xcrun simctl list runtimes ios || true

      - name: Ensure the android workload is present
        run: |
          # The runner already ships the iOS workload matched to its default Xcode; the
          # referenced projects also expose a net10.0-android TFM that is evaluated on macOS,
          # so add android without updating manifests (keeps iOS matched to Xcode).
          dotnet workload install android --skip-manifest-update

      - name: Fetch the Apple xcframework from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "v${{ inputs.version }}" --repo "$GITHUB_REPOSITORY" \
            -D dl -p 'FFmpegSharpApi.Native.Apple.*.nupkg'
          mkdir -p native/apple
          unzip -o dl/FFmpegSharpApi.Native.Apple.*.nupkg -d native/apple >/dev/null
          XCF="$(find "$PWD/native/apple" -name 'FFmpeg.xcframework' -type d | head -n1)"
          echo "FFMPEG_XCFRAMEWORK=$XCF" >> "$GITHUB_ENV"
          echo "xcframework: $XCF"

      - name: Build iOS simulator app
        run: |
          set -euo pipefail
          dotnet build Tests/FFmpegSharpApi.Tests.Maui/FFmpegSharpApi.Tests.Maui.csproj \
            -c Debug -f net10.0-ios \
            -p:RuntimeIdentifier=iossimulator-arm64 \
            -p:FFmpegXcframework="$FFMPEG_XCFRAMEWORK"
          find Tests/FFmpegSharpApi.Tests.Maui/bin -name '*.app' -type d -print

      - name: Run tests on iOS simulator
        run: bash "$GITHUB_WORKSPACE/build/ios-simulator-test.sh"

