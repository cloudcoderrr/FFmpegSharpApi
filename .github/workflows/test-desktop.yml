name: test-desktop

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-linux:
    uses: ./.github/workflows/native-linux.yml
    with:
      license: lgpl
      rids: linux-x64
  native-windows:
    uses: ./.github/workflows/native-windows.yml
    with:
      license: lgpl
      rids: win-x64
  native-apple:
    uses: ./.github/workflows/native-apple.yml
    with:
      license: lgpl
      rids: osx-arm64

  test:
    needs: [native-linux, native-windows, native-apple]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Download native binaries
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-lgpl-${{ matrix.rid }}
          path: native-dl

      - name: Extract native binaries
        shell: bash
        run: |
          mkdir -p native
          tar -C native -xzf native-dl/ffmpeg-lgpl-${{ matrix.rid }}.tar.gz
          echo "FFMPEG_NATIVE_DIR=$PWD/native/lgpl/${{ matrix.rid }}/lib" >> "$GITHUB_ENV"

      - name: Build desktop test runner
        run: dotnet build Tests/FFmpegSharpApi.Tests.Avalonia/FFmpegSharpApi.Tests.Avalonia.csproj -c Release

      - name: Run tests (headless)
        shell: bash
        env:
          FFMPEG_TEST_DATA: ${{ github.workspace }}/Tests/Data
          FFMPEG_TEST_OUTPUT: ${{ github.workspace }}/test-output
        run: |
          dotnet Tests/FFmpegSharpApi.Tests.Avalonia/bin/Release/net10.0/FFmpegSharpApi.Tests.Avalonia.dll --ci

      - name: Upload test output (logs, snapshots, audio)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.rid }}
          path: test-output
          retention-days: 14
          if-no-files-found: warn
