name: native-linux

on:
  workflow_dispatch:
    inputs:
      license:
        description: "License flavour to build"
        type: choice
        options: [both, lgpl, gpl]
        default: both
      rids:
        description: "Space-separated RIDs (blank = all linux)"
        type: string
        default: ""
  workflow_call:
    inputs:
      license:
        type: string
        default: both
      rids:
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: native-linux-${{ github.ref }}-${{ inputs.license }}-${{ inputs.rids }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        shell: bash
        run: |
          ALL="linux-x64 linux-x86 linux-arm64 linux-arm"
          RIDS="${{ inputs.rids }}"; [ -z "$RIDS" ] && RIDS="$ALL"
          LIC="${{ inputs.license }}"; [ -z "$LIC" ] && LIC="both"
          case "$LIC" in both) LICS="lgpl gpl";; *) LICS="$LIC";; esac
          inc=""; first=1
          for r in $RIDS; do for l in $LICS; do
            [ $first -eq 1 ] || inc="$inc,"; first=0
            inc="$inc{\"rid\":\"$r\",\"license\":\"$l\"}"
          done; done
          echo "matrix={\"include\":[$inc]}" >> "$GITHUB_OUTPUT"
          echo "include: [$inc]"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: ${{ matrix.rid }} / ${{ matrix.license }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential nasm yasm pkg-config git cmake ninja-build python3-pip zlib1g-dev \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
          python3 -m pip install --quiet --upgrade meson
          if [ "${{ matrix.rid }}" = "linux-x86" ]; then
            sudo dpkg --add-architecture i386
            sudo apt-get update
            sudo apt-get install -y gcc-multilib g++-multilib
          fi

      - name: Build FFmpeg
        run: |
          chmod +x build/ffmpeg/build.sh
          build/ffmpeg/build.sh --rid "${{ matrix.rid }}" --license "${{ matrix.license }}"

      - name: Package artifact
        run: |
          tar -C artifacts/native -czf "ffmpeg-${{ matrix.license }}-${{ matrix.rid }}.tar.gz" \
            "${{ matrix.license }}/${{ matrix.rid }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.license }}-${{ matrix.rid }}
          path: ffmpeg-${{ matrix.license }}-${{ matrix.rid }}.tar.gz
          retention-days: 14
          if-no-files-found: error
