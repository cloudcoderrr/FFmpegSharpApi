name: pack-meta

# Builds the multi-targeted FFmpegSharpApi.Native meta-package on macOS (needed
# for the net10.0-ios / net10.0-maccatalyst dependency groups). It resolves every
# FFmpegSharpApi.Native.* dependency from the already-published release assets, so
# it does not rebuild any native binaries.

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        default: "9.0.1-preview.1"

permissions:
  contents: read

jobs:
  pack:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install mobile workloads
        run: dotnet workload restore src/FFmpegSharpApi/FFmpegSharpApi.csproj

      - name: Download published managed + native packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/packages
          gh release download "v${{ inputs.version }}" --repo "$GITHUB_REPOSITORY" \
            -D artifacts/packages --skip-existing \
            -p 'FFmpegSharpApi.9*.nupkg' \
            -p 'FFmpegSharpApi.Native.Windows.*.nupkg' \
            -p 'FFmpegSharpApi.Native.Linux.*.nupkg' \
            -p 'FFmpegSharpApi.Native.macOS.*.nupkg' \
            -p 'FFmpegSharpApi.Native.Android.*.nupkg' \
            -p 'FFmpegSharpApi.Native.Apple.*.nupkg'
          ls -1 artifacts/packages

      - name: Pack full meta package
        run: |
          dotnet pack packaging/FFmpegSharpApi.Native/FFmpegSharpApi.Native.csproj -c Release \
            -o out \
            -p:MetaFull=true \
            -p:PackageVersion="${{ inputs.version }}" \
            -p:DependencyVersion="${{ inputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: meta-nupkg
          path: out/*.nupkg
          if-no-files-found: error
