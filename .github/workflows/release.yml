name: release

# Builds every native slice (both licence flavours, all platforms), assembles the
# iOS/Mac Catalyst xcframework, packs the managed, native, Apple and meta packages
# (managed and meta are multi-targeted so one reference works everywhere), and
# publishes them to the GitHub release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "NuGet package version (without leading v)"
        type: string
        default: "9.0.1-preview.1"
      licenses:
        description: "License flavours to build and pack"
        type: choice
        options: [both, lgpl, gpl]
        default: both
      prerelease:
        description: "Mark the GitHub release as a pre-release"
        type: boolean
        default: true
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-linux:
    uses: ./.github/workflows/native-linux.yml
    with:
      license: ${{ inputs.licenses || 'both' }}

  native-windows:
    uses: ./.github/workflows/native-windows.yml
    with:
      license: ${{ inputs.licenses || 'both' }}

  native-apple:
    uses: ./.github/workflows/native-apple.yml
    with:
      license: ${{ inputs.licenses || 'both' }}
      rids: ""   # all apple slices: macOS + iOS + simulators + Mac Catalyst

  native-android:
    uses: ./.github/workflows/native-android.yml
    with:
      license: ${{ inputs.licenses || 'both' }}

  pack:
    needs: [native-linux, native-windows, native-apple, native-android]
    runs-on: macos-latest   # macOS so the xcframework and ios/maccatalyst TFMs can be built
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"; VER="${TAG#v}"
          else
            VER="${{ inputs.version }}"; TAG="v$VER"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Version=$VER Tag=$TAG"

      - name: Select Xcode matching the baseline .NET for iOS
        run: |
          pick="$(ls -d /Applications/Xcode_26.0*.app 2>/dev/null | sort -V | tail -1)"
          [ -z "$pick" ] && pick="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          [ -n "$pick" ] && sudo xcode-select -s "$pick/Contents/Developer"
          xcodebuild -version

      - name: Install workloads (baseline manifest, matched to Xcode)
        run: |
          dotnet workload install maui --skip-manifest-update
          dotnet workload install android --skip-manifest-update

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          path: native-artifacts
          pattern: ffmpeg-*
          merge-multiple: false

      - name: Arrange native binaries
        run: |
          mkdir -p artifacts/native
          find native-artifacts -name '*.tar.gz' -exec tar -C artifacts/native -xzf {} \;
          echo "Staged native trees:"; find artifacts/native -maxdepth 2 -type d | sort

      - name: Pack NuGet packages
        env:
          PACKAGE_VERSION: ${{ steps.meta.outputs.version }}
          NATIVE_DIR: ${{ github.workspace }}/artifacts/native
          OUT_DIR: ${{ github.workspace }}/artifacts/packages
        run: |
          chmod +x build/pack.sh build/apple-xcframework.sh
          build/pack.sh

      - uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  release:
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nupkgs
          path: dist

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.pack.outputs.tag }}
          VER: ${{ needs.pack.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          FLAGS=()
          [ "${PRERELEASE:-true}" = "true" ] && FLAGS+=(--prerelease)
          NOTES="FFmpeg 9.0.1 for .NET: managed bindings plus native binaries for Windows, Linux, macOS, Android, iOS and Mac Catalyst. LGPL v3 on every platform; GPL v3 where available. See the README for usage."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.nupkg --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/*.nupkg \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "FFmpegSharpApi $VER" \
              --notes "$NOTES" \
              "${FLAGS[@]}"
          fi
          echo "Release assets:"; gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
